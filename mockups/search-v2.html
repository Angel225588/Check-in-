<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recherche v2 — maquette</title>
<style>
  :root{
    --bg:#12100E; --surface:#1B1815; --surface-2:#221E1A;
    --key:#2A2621; --key-edge:#463F35; --key-press:#3A342C;
    --ink:#F4EFE6; --ink-2:#DDD5C7; --muted:#ABA294;
    --gold:#DD9C28; --gold-deep:#A66914;
    /* Same green as the check-in CTA. White on a lighter green measured
       2.34:1 — the exact trap this token already solves. */
    --good:#2F6F4F; --bad:#E0685A; --violet:#B99BE8;
    /* "-ink" variants are for text sitting ON a tinted wash of the same hue,
       where the solid colour is far too close to its own background. */
    --gold-ink:#E9B44C; --bad-ink:#F5A196; --violet-ink:#CDB6F0; --good-ink:#6FD3A0;
    --r-lg:20px; --r-md:14px; --r-sm:11px;
  }
  body.light{
    --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F5F0E7;
    --key:#FFFFFF; --key-edge:#D8CBB3; --key-press:#EFE7D9;
    --ink:#241F19; --ink-2:#3C352C; --muted:#6B6355;
    --good:#2F6F4F; --bad:#A13B2C; --violet:#5A3B8F; --gold:#A66914;
    --gold-ink:#7F4E0E; --bad-ink:#8C2F22; --violet-ink:#4A2E78; --good-ink:#1F5638;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Nunito',-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .frame{width:1194px;height:834px;margin:18px auto;display:flex;flex-direction:column;
    gap:10px;padding:12px;background:var(--bg);border-radius:26px;overflow:hidden;
    box-shadow:0 30px 90px -30px rgba(0,0,0,.6)}

  /* ── header ─────────────────────────────────────────── */
  .top{display:flex;align-items:stretch;gap:10px}
  .btn-back{display:flex;align-items:center;gap:7px;padding:0 18px;min-height:56px;
    background:var(--surface);border:1px solid var(--key-edge);border-radius:999px;
    color:var(--gold-ink);font-weight:800;font-size:15px;cursor:pointer}
  .metrics{flex:1;display:flex;align-items:center;background:var(--surface);
    border:1px solid var(--key-edge);border-radius:var(--r-lg);padding:6px}
  .m{flex:1;text-align:center;padding:8px 4px;border-radius:var(--r-md);cursor:pointer}
  .m:hover{background:var(--surface-2)}
  .m .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:800}
  .m .val{font-size:30px;font-weight:800;line-height:1.05;margin-top:2px;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  /* ONE accent: what is still outstanding. Everything else is cream. */
  .m.focal{background:rgba(221,156,40,.10);box-shadow:inset 0 0 0 1.5px var(--gold)}
  .m.focal .val{color:var(--gold-ink);font-size:34px}
  .m.focal .lab{color:var(--gold-ink)}
  body.rainbow .m.entered .val{color:var(--good)}
  body.rainbow .m.comp .val{color:var(--violet-ink)}
  body.rainbow .m.vip .val{color:var(--gold-ink)}
  .navbtns{display:flex;gap:8px}
  .nav{width:56px;height:56px;display:grid;place-items:center;background:var(--surface);
    border:1px solid var(--key-edge);border-radius:var(--r-md);color:var(--ink-2);cursor:pointer}
  .nav:hover{background:var(--surface-2)}
  .nav svg{width:22px;height:22px}

  /* ── body split ─────────────────────────────────────── */
  .body{flex:1;display:flex;gap:10px;min-height:0}
  .left{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
  .right{width:392px;display:flex;flex-direction:column;gap:9px}

  .sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:800;padding-left:3px}

  /* recents strip */
  .recents{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chip{flex:none;display:flex;align-items:center;gap:9px;padding:0 14px;min-height:52px;
    background:var(--surface);border:1px solid var(--key-edge);border-radius:999px;cursor:pointer}
  .chip b{font-size:17px;font-variant-numeric:tabular-nums}
  .chip .who{font-size:13px;color:var(--muted);max-width:110px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .pax{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;
    font-size:13px;font-weight:800;border:2px solid var(--gold);color:var(--gold-ink)}

  /* results */
  .list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px}
  .row{display:flex;align-items:center;gap:14px;padding:11px 12px;background:var(--surface);
    border:1px solid var(--key-edge);border-radius:var(--r-md);cursor:pointer;min-height:66px}
  .row:hover{background:var(--surface-2)}
  .row.hit{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(221,156,40,.08)}
  .rm{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px}
  .nm{flex:1;min-width:0}
  .nm .n{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nm .s{font-size:12.5px;color:var(--muted);margin-top:1px}
  .tags{display:flex;gap:6px;align-items:center}
  .tag{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .t-vip{background:rgba(221,156,40,.16);color:var(--gold-ink)}
  .t-alert{background:rgba(224,104,90,.16);color:var(--bad-ink)}
  .t-comp{background:rgba(185,155,232,.16);color:var(--violet-ink)}
  .t-pay{background:rgba(224,104,90,.16);color:var(--bad-ink)}
  .go{display:flex;align-items:center;gap:7px;padding:0 17px;min-height:48px;border:none;
    border-radius:999px;background:var(--good);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
    /* A guest carrying an alert, or one who still owes for breakfast, cannot be
     waved through from the list. The row sends you to the fiche instead. */
  .go.needs{background:transparent;border:1.5px solid var(--key-edge);color:var(--ink-2)}
  .row.done{opacity:.5}
  .row.done .go{background:transparent;color:var(--gold-ink);border:1.5px solid var(--key-edge)}

  /* ── right column ───────────────────────────────────── */
  /* One box, two jobs. Idle it is the service clock; searching it is the
     guest preview. Height is FIXED so the keypad never shifts under a
     thumb that is already moving toward it. */
  .detail{background:var(--surface);border:1px solid var(--key-edge);
    border-radius:var(--r-lg);padding:13px 16px;height:158px;display:flex;
    flex-direction:column;justify-content:center;overflow:hidden}

  /* idle — service clock */
  .clockrow{display:flex;align-items:baseline;gap:10px}
  .clock{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em}
  .rush{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;background:rgba(221,156,40,.16);color:var(--gold-ink)}
  .bar{height:7px;border-radius:999px;background:var(--key);overflow:hidden;margin:11px 0 7px;
    border:1px solid var(--key-edge)}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:999px}
  .svc{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
    font-weight:700}
  .svc b{color:var(--ink-2)}

  /* searching — guest preview */
  .typed{font-size:42px;font-weight:800;letter-spacing:.10em;font-variant-numeric:tabular-nums;
    line-height:1}
  .typed .ph{color:var(--muted);opacity:.45}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dname{font-size:19px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .dsub{font-size:13.5px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .dnone{font-size:14px;color:var(--muted);margin-top:8px}
  .who-badge{flex:none;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px}
  .b-first{background:rgba(221,156,40,.16);color:var(--gold-ink)}
  .b-freq{background:rgba(47,111,79,.20);color:var(--good-ink)}

  .secondary{min-height:52px;border-radius:var(--r-md);background:transparent;
    border:1.5px solid var(--key-edge);color:var(--ink-2);font-size:15px;font-weight:800;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .secondary[disabled]{opacity:.3;cursor:default}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .k{height:74px;border-radius:var(--r-md);background:var(--key);
    border:1.5px solid var(--key-edge);color:var(--ink);font-size:27px;font-weight:700;
    cursor:pointer;display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .k:active{background:var(--key-press)}
  .k.alt{font-size:15px;font-weight:800;color:var(--muted)}
  .enter{min-height:70px;border:none;border-radius:var(--r-md);background:var(--good);
    color:#fff;font-size:21px;font-weight:800;cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:10px}
  .enter[disabled]{opacity:.32;cursor:default}

  /* toolbar (mockup only) */
  .tools{width:1194px;margin:0 auto 6px;display:flex;gap:8px;align-items:center;
    font-family:system-ui;font-size:13px;color:#8a8175}
  .tools button{padding:7px 13px;border-radius:999px;border:1px solid #55504a;
    background:#221E1A;color:#DDD5C7;cursor:pointer;font-weight:700}
  body.light .tools button{background:#fff;color:#3C352C;border-color:#D8CBB3}
</style>
</head>
<body>

<div class="tools">
  <button onclick="document.body.classList.toggle('light')">Clair / Sombre</button>
  <button onclick="document.body.classList.toggle('rainbow')">Comparer : 1 accent ⇄ 5 couleurs</button>
  <button onclick="document.body.classList.toggle('mirror')">Inverser (gaucher / droitier)</button>
  <span>— maquette interactive : tapez au clavier ou sur le pavé</span>
</div>

<div class="frame" id="frame">

  <!-- header -->
  <div class="top">
    <button class="btn-back">‹ Upload</button>
    <div class="metrics">
      <div class="m"><div class="lab">Total</div><div class="val">164</div></div>
      <div class="m entered"><div class="lab">Entrés</div><div class="val">126</div></div>
      <div class="m focal"><div class="lab">Restants</div><div class="val" id="mRest">38</div></div>
      <div class="m comp"><div class="lab">Offert</div><div class="val">9/12</div></div>
      <div class="m vip"><div class="lab">VIP</div><div class="val">15</div></div>
    </div>
    <div class="navbtns">
      <div class="nav" title="Récents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div class="nav" title="Rapport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-6"/></svg></div>
      <div class="nav" title="Clôturer la journée"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg></div>
    </div>
  </div>

  <!-- body -->
  <div class="body" id="split">
    <div class="left">
      <div class="sec">Récents</div>
      <div class="recents" id="recents"></div>
      <div class="sec" id="listLabel">Restants — 38 chambres</div>
      <div class="list" id="list"></div>
    </div>

    <div class="right">
      <div class="detail" id="detail"></div>
      <div class="pad" id="pad"></div>
      <button class="enter" id="enter" disabled>⏎ Entrer</button>
      <button class="secondary" id="openfile" disabled>Ouvrir la fiche →</button>
    </div>
  </div>
</div>

<script>
const ROOMS = [
  {r:"224", n:"Angel Polanco",      p:3, vip:true,  alert:"Allergie arachide", visits:6},
  {r:"385", n:"Maria Dupont",       p:2, visits:0},
  {r:"402", n:"Chen Wei",           p:4, comp:true, visits:2},
  {r:"418", n:"Sofia Marchand",     p:1, pay:true, visits:0},
  {r:"501", n:"Julien Fabre",       p:2, vip:true, visits:11},
  {r:"524", n:"Tete Sedalo",        p:4, pay:true, visits:0},
  {r:"608", n:"Amira Haddad",       p:2},
  {r:"619", n:"Julie David",        p:1},
  {r:"702", n:"Lucas Moreau",       p:2, done:true},
  {r:"715", n:"Nina Kowalski",      p:3},
  {r:"801", n:"Omar Benali",        p:2},
  {r:"822", n:"Claire Lefèvre",     p:1, vip:true},
];
const RECENT = ["224","385","402","501"];

let typed = "";

const el = (id)=>document.getElementById(id);

/* keypad */
const KEYS = ["1","2","3","4","5","6","7","8","9","ABC","0","⌫"];
el("pad").innerHTML = KEYS.map(k=>
  `<button class="k ${/[0-9]/.test(k)?"":"alt"}" data-k="${k}">${k}</button>`).join("");
el("pad").addEventListener("click", e=>{
  const b = e.target.closest("[data-k]"); if(!b) return;
  press(b.dataset.k);
});
document.addEventListener("keydown", e=>{
  if(/^[0-9]$/.test(e.key)) press(e.key);
  else if(e.key==="Backspace") press("⌫");
  else if(e.key==="Enter") doEnter();
});
function press(k){
  if(k==="⌫") typed = typed.slice(0,-1);
  else if(k==="ABC"){ /* alpha mode — out of scope for the mockup */ }
  else if(typed.length<4) typed += k;
  render();
}

function match(){ return ROOMS.filter(x=>x.r.startsWith(typed)); }
function exact(){ return typed.length>=3 ? ROOMS.find(x=>x.r===typed) : null; }

function tagsFor(x){
  let t="";
  if(x.alert) t+=`<span class="tag t-alert">⚠ ${x.alert}</span>`;
  if(x.vip)   t+=`<span class="tag t-vip">VIP</span>`;
  if(x.comp)  t+=`<span class="tag t-comp">OFFERT</span>`;
  if(x.pay)   t+=`<span class="tag t-pay">À ENCAISSER</span>`;
  return t;
}

function whoBadge(x){
  // Frequent vs first visit, straight in the preview: it changes how you
  // greet them, and it is the single thing reception asks for by name.
  return x.visits > 0
    ? `<span class="who-badge b-freq">Habitué · ${x.visits}ᵉ séjour</span>`
    : `<span class="who-badge b-first">1ʳᵉ visite</span>`;
}

/* Service window — breakfast runs 06:30 to 10:30. */
const SVC_START = 6.5, SVC_END = 10.5;
let clockH = 7, clockM = 12;
function serviceBox(){
  const now = clockH + clockM/60;
  const pct = Math.max(0, Math.min(1, (now - SVC_START) / (SVC_END - SVC_START)));
  const leftMin = Math.max(0, Math.round((SVC_END - now) * 60));
  const rush = now >= 7.5 && now <= 9 ? `<span class="rush">Pointe</span>` : "";
  return `
    <div class="clockrow">
      <div class="clock">${String(clockH).padStart(2,"0")}:${String(clockM).padStart(2,"0")}</div>
      ${rush}
    </div>
    <div class="bar"><i style="width:${(pct*100).toFixed(1)}%"></i></div>
    <div class="svc">
      <span>Service <b>06:30 – 10:30</b></span>
      <span><b>${Math.floor(leftMin/60)}h${String(leftMin%60).padStart(2,"0")}</b> restantes</span>
    </div>`;
}

function render(){
  const hit = exact();
  const near = match();

  /* ── the box: clock when idle, guest preview when searching ── */
  if(!typed){
    el("detail").innerHTML = serviceBox();
  } else if(hit){
    el("detail").innerHTML = `
      <div class="prow">
        <div class="typed">${typed.split("").join(" ")}</div>
        ${whoBadge(hit)}
      </div>
      <div class="dname">${hit.n}</div>
      <div class="dsub"><b>${hit.p} pers.</b> ${tagsFor(hit)}</div>`;
  } else {
    el("detail").innerHTML = `
      <div class="typed">${typed.split("").join(" ")}</div>
      <div class="dnone">${near.length} chambre(s) commencent par ${typed}</div>`;
  }

  /* ── actions ── */
  const enter = el("enter"), open = el("openfile");
  enter.disabled = !hit;
  open.disabled  = !hit;
  if(hit){
    // A guest who needs money taken, or carries an alert, must not be
    // waved through with one tap — the fiche is the primary action there.
    const mustOpen = !!(hit.alert || hit.pay);
    enter.innerHTML = mustOpen ? `⏎ Entrer quand même` : `⏎ Entrer &nbsp;<b>${hit.p}</b>`;
    enter.style.background = mustOpen ? "transparent" : "";
    enter.style.border     = mustOpen ? "1.5px solid var(--key-edge)" : "";
    enter.style.color      = mustOpen ? "var(--ink-2)" : "";
    open.style.background  = mustOpen ? "var(--good)" : "";
    open.style.color       = mustOpen ? "#fff" : "";
    open.style.border      = mustOpen ? "none" : "";
    open.innerHTML = mustOpen
      ? (hit.alert ? `⚠ Ouvrir la fiche →` : `Encaisser · ouvrir →`)
      : `Ouvrir la fiche →`;
  } else {
    enter.innerHTML = `⏎ Entrer`;
    enter.style.cssText = ""; open.style.cssText = "";
    open.innerHTML = `Ouvrir la fiche →`;
  }

  /* ── list ── */
  const shown = typed ? near : ROOMS;
  el("listLabel").textContent = typed
    ? `Résultats — ${shown.length}`
    : `Restants — ${ROOMS.filter(x=>!x.done).length} chambres`;
  el("list").innerHTML = shown.map(x=>`
    <div class="row ${x.done?"done":""} ${hit&&hit.r===x.r?"hit":""}">
      <div class="rm">${x.r}</div>
      <div class="nm">
        <div class="n">${x.n}</div>
        <div class="s">${x.p} personne${x.p>1?"s":""}${x.done?" · déjà entré":""}</div>
      </div>
      <div class="tags">${tagsFor(x)}</div>
      <button class="go ${(x.alert||x.pay)&&!x.done?"needs":""}">${
        x.done ? "✓ Entré"
        : x.alert ? "⚠ Ouvrir →"
        : x.pay   ? "Encaisser →"
        : "✓ Entrer "+x.p}</button>
    </div>`).join("");
}

el("recents").innerHTML = RECENT.map(r=>{
  const x = ROOMS.find(y=>y.r===r);
  return `<div class="chip" data-r="${r}"><b>${x.r}</b><span class="who">${x.n}</span><span class="pax">${x.p}</span></div>`;
}).join("");
el("recents").addEventListener("click",e=>{
  const c=e.target.closest("[data-r]"); if(!c) return;
  typed=c.dataset.r; render();
});

function doEnter(){
  const hit = exact(); if(!hit) return;
  const b=el("enter"); b.textContent="✓ Enregistré"; b.style.background="var(--gold-deep)";
  setTimeout(()=>{ typed=""; render(); b.style.background=""; },700);
}
el("enter").addEventListener("click", doEnter);
el("openfile").addEventListener("click", ()=>{ if(exact()) alert("→ fiche client (maquette)"); });
setInterval(()=>{ clockM=(clockM+1)%60; if(clockM===0) clockH=(clockH+1)%24; if(!typed) render(); }, 60000);

/* handedness mirror */
new MutationObserver(()=>{
  el("split").style.flexDirection =
    document.body.classList.contains("mirror") ? "row-reverse" : "row";
}).observe(document.body,{attributes:true,attributeFilter:["class"]});

render();
</script>
</body>
</html>
